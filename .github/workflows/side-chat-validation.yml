name: Side chat validation

on:
  push:
    branches: [feat/side-chat-workflow]
  pull_request:
    paths:
      - 'packages/**'
      - '.github/workflows/side-chat-validation.yml'

permissions:
  contents: read

concurrency:
  group: side-chat-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          LEFTHOOK: '0'
      - run: npm run build:server-deps && npm run build:app-deps
      - name: Validation dependencies
        if: github.event_name == 'push'
        run: find . -type d -name node_modules -prune -print0 | tar --exclude='*/.cache/*' -I 'gzip -1' -cf "$RUNNER_TEMP/side-dependencies.tar.gz" --null -T -
      - uses: actions/upload-artifact@v4
        if: github.event_name == 'push'
        with:
          name: side-dependencies
          path: ${{ runner.temp }}/side-dependencies.tar.gz
          compression-level: 0
          retention-days: 1
      - name: Typecheck
        if: success() || failure()
        run: npm run typecheck --workspace=@getpaseo/server && npm run typecheck --workspace=@getpaseo/app
      - name: Server Side regressions
        if: success() || failure()
        working-directory: packages/server
        run: npx vitest run src/server/side --bail=1 --maxWorkers=2
      - name: App Side regressions
        if: success() || failure()
        working-directory: packages/app
        run: npx vitest run src/panels/side-panel --bail=1 --maxWorkers=2
      - name: Lint
        if: success() || failure()
        run: npm run lint -- --format=stylish
