name: Apply Side implementation

on:
  push:
    branches: [feat/side-chat-workflow]
    paths: ['.github/side-patch/READY', '.github/workflows/side-chat-validation.yml']

permissions:
  contents: write

jobs:
  apply:
    if: github.repository == 'Dvitash/paseo' && github.ref == 'refs/heads/feat/side-chat-workflow'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify and apply reviewed patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, lzma, subprocess
          root = Path('.github/side-patch')
          encoded = ''.join((root / f'{i}.b64').read_text() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded))
          expected = (root / 'READY').read_text().strip()
          if hashlib.sha256(patch).hexdigest() != expected:
              raise SystemExit('Patch integrity check failed')
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          PY
          rm -rf .github/side-patch
      - name: Commit implementation on feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add packages docs
          git add -u .github/side-patch
          git commit -m 'feat: make Side chat reliable, contextual, and actionable'
          git push origin HEAD:feat/side-chat-workflow
          git rev-parse HEAD
