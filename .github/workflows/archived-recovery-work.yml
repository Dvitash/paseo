name: Archived recovery validation

on:
  push:
    branches: [fix/archived-chat-recovery]
    paths: [.github/workflows/archived-recovery-work.yml]

permissions:
  contents: write

concurrency:
  group: archived-recovery-validation
  cancel-in-progress: false

jobs:
  validate:
    if: github.repository == 'Dvitash/paseo' && github.ref == 'refs/heads/fix/archived-chat-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
      LEFTHOOK: "0"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/archived-chat-recovery
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed corrections
        run: |
          if test -f .github/recovery-corrections.patch; then
            echo '3e937a0e1bc67f6d0aae4115662b40c14a230e3793c497bf14d6c26bd27f996c  .github/recovery-corrections.patch' | sha256sum --check
            git apply --check .github/recovery-corrections.patch
            git apply --index .github/recovery-corrections.patch
            git rm .github/recovery-corrections.patch
          fi
          git diff --name-only --diff-filter=ACMR 4e70facbd3c0fbba3314b4aa5eb6853efe77c250 -- docs packages | tr '\n' '\0' > /tmp/recovery-files
      - run: npm ci
      - name: Format and commit feature branch corrections
        run: |
          xargs -0 npx oxfmt < /tmp/recovery-files
          xargs -0 git add -- < /tmp/recovery-files
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git -c core.hooksPath=/dev/null commit -m 'fix: align archived recovery with data policy and exercise continuation'
            git push origin HEAD:refs/heads/fix/archived-chat-recovery
          fi
      - name: Build dependencies
        run: npm run build:server-deps && npm run build:app-deps
      - name: Typecheck
        if: success() || failure()
        run: |
          set -o pipefail
          (npm run typecheck --workspace=@getpaseo/server && npm run typecheck --workspace=@getpaseo/app) 2>&1 | tee /tmp/recovery-typecheck.log
      - name: Lint changed sources
        if: success() || failure()
        run: |
          set -o pipefail
          xargs -0 npx oxlint --format=stylish < /tmp/recovery-files 2>&1 | tee /tmp/recovery-lint.log
      - name: Server regressions
        if: success() || failure()
        working-directory: packages/server
        run: |
          set -o pipefail
          npx vitest run src/server/session/workspace-recovery src/server/agent/archived-agent-history.test.ts src/server/daemon-e2e/archived-history.local.e2e.test.ts src/server/workspace-archive-service.test.ts src/server/agent/agent-storage.test.ts src/server/agent/provider-registry-wrap.test.ts src/server/agent/agent-manager.test.ts src/server/session.workspaces.test.ts src/server/workspace-archive-record-scoped.e2e.test.ts --maxWorkers=2 2>&1 | tee /tmp/recovery-server.log
      - name: Client regressions
        if: success() || failure()
        working-directory: packages/client
        run: |
          set -o pipefail
          npx vitest run src/saved-history.test.ts --maxWorkers=2 2>&1 | tee /tmp/recovery-client.log
      - name: App unit regressions
        if: success() || failure()
        working-directory: packages/app
        run: |
          set -o pipefail
          npx vitest run src/workspace-recovery/model.test.ts src/workspace-recovery/continue-saved-chat.test.ts src/i18n/resources.test.ts src/data/query.test.ts src/data/fetch-infinite-query.test.ts --project=unit --maxWorkers=2 2>&1 | tee /tmp/recovery-app.log
      - name: Browser setup
        if: success() || failure()
        run: npx playwright install --with-deps chromium
      - name: Browser regressions
        if: success() || failure()
        working-directory: packages/app
        run: |
          set -o pipefail
          npx vitest run src/workspace-recovery/archived-chat-recovery.browser.test.tsx --project=browser --maxWorkers=1 2>&1 | tee /tmp/recovery-browser.log
      - name: Export validation sources
        if: always()
        run: git archive --format=tar.gz HEAD > /tmp/recovery-validated-source.tar.gz
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: archived-recovery-validation
          path: |
            /tmp/recovery-*.log
            /tmp/recovery-validated-source.tar.gz
            packages/app/.vitest-screenshots
          retention-days: 2
