name: Side review export
on:
  push:
    branches: [feat/side-chat-workflow]
    paths: [.github/workflows/side-review-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          LEFTHOOK: '0'
      - run: npm run build:server-deps && npm run build:app-deps
      - name: Archive tracked source and installed test dependencies
        run: |
          git archive -o /tmp/side-source.tar HEAD
          find node_modules packages -type d \( -name node_modules -o -name dist -o -name build \) -prune -print0 | tar --null -czf /tmp/side-dependencies.tar.gz -T -
      - uses: actions/upload-artifact@v4
        with:
          name: side-review-workspace
          path: |
            /tmp/side-source.tar
            /tmp/side-dependencies.tar.gz
          retention-days: 1
          compression-level: 0
