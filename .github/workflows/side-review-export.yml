name: Side review export
on:
  push:
    branches: [feat/side-chat-workflow]
    paths: [.github/workflows/side-review-export.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - run: git archive -o /tmp/side-source.tar HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: side-review-source
          path: /tmp/side-source.tar
          retention-days: 1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
          LEFTHOOK: '0'
      - run: npm run build:server-deps && npm run build:app-deps
      - name: Archive installed test dependencies
        run: |
          find node_modules packages -type d \( -name node_modules -o -name dist -o -name build \) -prune -print0 | tar --null -czf /tmp/side-dependencies.tar.gz -T -
          split -b 350M -d /tmp/side-dependencies.tar.gz /tmp/side-deps-
      - uses: actions/upload-artifact@v4
        with:
          name: side-review-deps-0
          path: /tmp/side-deps-00
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: side-review-deps-1
          path: /tmp/side-deps-01
          retention-days: 1
          compression-level: 0
      - uses: actions/upload-artifact@v4
        with:
          name: side-review-deps-2
          path: /tmp/side-deps-02
          retention-days: 1
          compression-level: 0
