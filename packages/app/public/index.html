<!doctype html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="robots" content="noindex,nofollow" />
    <meta name="theme-color" content="#181B1A" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Paseo" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover"
    />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/katex/katex.min.css" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* Keep the app shell fixed to the viewport. */
      html,
      body {
        width: 100%;
        height: 100%;
        height: 100dvh;
        margin: 0;
        padding: 0;
        overflow: hidden;
        overscroll-behavior: none;
      }
      /* These styles smooth text rendering in the app shell. */
      body {
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* Prevent white flash before React mounts */
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #181b1a;
        }
      }
      /* iOS standalone PWAs can report 100dvh/innerHeight short of the
      painted area, leaving a dead band at the bottom. The shortfall is
      measured at runtime against visualViewport.height (the actually-visible
      region, so it can never overshoot) and injected through
      --paseo-viewport-compensation by use-standalone-pwa-viewport-heal.ts.
      Gated on the `ios-standalone` class so Android/desktop standalone,
      which report correct heights, are untouched. */
      .ios-standalone,
      .ios-standalone body {
        height: calc(100dvh + var(--paseo-viewport-compensation, 0px));
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        width: 100%;
        height: 100%;
        flex: 1;
        min-width: 0;
        min-height: 0;
        overflow: hidden;
      }
    </style>
    <script>
      // iOS standalone PWAs need the viewport compensation above. This must
      // run before first paint, so it lives inline rather than in the bundle.
      // Detection mirrors isAppleHandheldPlatform + the standalone checks in
      // use-standalone-pwa-viewport-heal.ts.
      (function () {
        var nav = window.navigator;
        var isIos =
          /iPad|iPhone|iPod/.test(nav.userAgent) ||
          (/Mac/i.test(nav.platform || "") && nav.maxTouchPoints > 1);
        var isStandalone =
          ("standalone" in nav && Boolean(nav.standalone)) ||
          (typeof window.matchMedia === "function" &&
            window.matchMedia("(display-mode: standalone)").matches);
        if (isIos && isStandalone) {
          document.documentElement.classList.add("ios-standalone");
        }
      })();
    </script>
    <style>
      button,
      a,
      input,
      textarea,
      select,
      [role="button"],
      [role="link"],
      [role="textbox"],
      [role="combobox"],
      [role="tab"],
      [role="switch"],
      [role="checkbox"],
      [role="slider"],
      [role="menuitem"],
      [tabindex],
      [contenteditable="true"] {
        -webkit-app-region: no-drag !important;
      }

      /* Suppress the browser's default focus outline — it appears on mouse
         clicks and looks out of place against our themed surfaces. Keep a
         themed ring for keyboard users via :focus-visible. */
      *:focus {
        outline: none;
      }
      *:focus-visible {
        outline: 2px solid #20744a;
        outline-offset: 2px;
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
